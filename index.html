<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RNC EXOS Tournament</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#0b0b0b;
    color:white;
}

header{
    background:#ffd700;
    color:#000;
    padding:25px 15px;
    text-align:center;
}

header h1{
    margin:0;
    font-size:32px;
}

header p{
    margin:8px 0 0;
}

.container{
    max-width:700px;
    margin:auto;
    padding:20px;
}

.card{
    background:#171717;
    border:1px solid #333;
    border-radius:15px;
    padding:20px;
    margin-bottom:20px;
}

h2{
    color:#ffd700;
}

button{
    background:#ffd700;
    color:#000;
    border:0;
    padding:13px 20px;
    border-radius:8px;
    font-weight:bold;
    cursor:pointer;
}

input{
    width:100%;
    box-sizing:border-box;
    padding:13px;
    margin:7px 0;
    border-radius:7px;
    border:1px solid #555;
    background:#222;
    color:white;
}

footer{
    text-align:center;
    padding:20px;
    color:#aaa;
}
</style>
</head>

<body>

<header>
    <h1>RNC EXOS</h1>
    <p>Gaming Tournament</p>
</header>

<div class="container">

<div class="card">
    <h2>🏆 Tournament</h2>
    <p>Join the tournament and show your skills!</p>
    <button onclick="showForm()">Register Now</button>
</div>

<div class="card" id="form" style="display:none;">
    <h2>📝 Registration</h2>

    <input type="text" id="name" placeholder="Player Name">

    <input type="text" id="uid" placeholder="Game UID">

    <input type="tel" id="phone" placeholder="Phone Number">

    <button onclick="sendOTP()">Send OTP</button>

    <div id="otpSection" style="display:none;">
        <input type="text" id="otp" placeholder="Enter OTP">
        <button onclick="verifyOTP()">Verify OTP</button>
    </div>

    <p id="message"></p>

    <div id="recaptcha-container"></div>
</div>

<div class="card">
    <h2>📊 Live Scoreboard</h2>
    <p>Coming Soon...</p>
</div>

<div class="card">
    <h2>💳 Entry Fee</h2>
    <p>Payment details will be added soon.</p>
</div>

</div>

<footer>
    © 2026 RNC EXOS
</footer>
<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
    getAuth,
    RecaptchaVerifier,
    signInWithPhoneNumber
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


const firebaseConfig = {
    apiKey: "AIzaSyDwwexgFL33ELp2eAfNsuj8mgnrzXuVPP4",
    authDomain: "rnc-exos.firebaseapp.com",
    projectId: "rnc-exos",
    storageBucket: "rnc-exos.firebasestorage.app",
    messagingSenderId: "255043598583",
    appId: "1:255043598583:web:4c1a3232984732d2f53bf2",
    measurementId: "G-PK8KBFH1BZ"
};


const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

let confirmationResult = null;


window.showForm = function(){

    document.getElementById("form").style.display = "block";

};


window.sendOTP = async function(){

    const phone = document.getElementById("phone").value.trim();
    const message = document.getElementById("message");

    if(phone === ""){
        message.innerText = "Please enter your phone number.";
        return;
    }

    if(!phone.startsWith("+")){
        message.innerText =
        "Please enter country code. Example: +91XXXXXXXXXX";
        return;
    }

    try{

        window.recaptchaVerifier = new RecaptchaVerifier(
            auth,
            "recaptcha-container",
            {
                size: "normal"
            }
        );

        confirmationResult = await signInWithPhoneNumber(
            auth,
            phone,
            window.recaptchaVerifier
        );

        document.getElementById("otpSection").style.display = "block";

        message.innerText =
        "OTP sent successfully. Check your phone.";

    }catch(error){

        console.error(error);

        message.innerText =
        "OTP could not be sent. Please check the number and Firebase settings.";

    }

};


window.verifyOTP = async function(){

    const otp = document.getElementById("otp").value.trim();
    const message = document.getElementById("message");

    if(otp === ""){
        message.innerText = "Please enter the OTP.";
        return;
    }

    if(!confirmationResult){
        message.innerText = "Please request OTP first.";
        return;
    }

    try{

        await confirmationResult.confirm(otp);

        message.innerText =
        "Phone verified successfully!";

    }catch(error){

        console.error(error);

        message.innerText =
        "Invalid OTP. Please try again.";

    }

};

</script>
<script>
function register(){

    const name = document.getElementById("name").value.trim();
    const uid = document.getElementById("uid").value.trim();
    const phone = document.getElementById("phone").value.trim();
    const message = document.getElementById("message");

    if(name === "" || uid === "" || phone === ""){
        message.innerText = "Please fill all details.";
        return;
    }

    message.innerText = "Registration submitted successfully!";
}
</script>

</body>
</html>
